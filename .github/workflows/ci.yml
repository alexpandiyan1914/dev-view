name: CI

on:
  push:
    branches: [main, alex-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run for the same branch, so the queue stays short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check what would be published
        run: npm run check:package

      - name: Dev View checks itself
        # Prints the full report in the log. (A `dev-view ci` command with exit codes is on the roadmap.)
        run: node dist/cli.js local . --verbose
